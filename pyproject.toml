[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-opportunity-monitor"
version = "0.1.0"
description = "Daily public-procurement monitor for Myers McRae opportunities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.61.0",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
rfp-monitor = "rfp_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
